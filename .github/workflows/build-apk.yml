
name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: unzip JARVIS_GitHub_Build_Ready.zip

      - name: Fix Kotlin singleLine errors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("JARVIS_Android_Project/app/src/main/java/com/personal/jarvis/MainActivity.kt")
          s = p.read_text()
          s = s.replace("singleLine = false", "setSingleLine(false)")
          s = s.replace("singleLine = true", "setSingleLine(true)")
          p.write_text(s)
          PY

      - name: Fix Java and Kotlin JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("JARVIS_Android_Project/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              "android {",
              """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }""",
              1
          )
          p.write_text(s)
          PY

      - name: Accept Android SDK licences and install SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd JARVIS_Android_Project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: JARVIS_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
